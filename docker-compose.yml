name: loopine

services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/backend}
        API_PROXY_ORIGIN: ${API_PROXY_ORIGIN:-http://host.docker.internal:8000}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/backend}
      API_PROXY_ORIGIN: ${API_PROXY_ORIGIN:-http://host.docker.internal:8000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:3000"

  web-test:
    profiles: ["test"]
    build:
      context: .
      target: builder
    command: ["npm", "test", "--", "--run"]
